<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;overflow:hidden}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;height:min(45vw,450px);min-height:180px;padding:0}.frame{overflow:hidden;background:#f5f0f7}.frame img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease,transform 1s ease}.frame img:hover{transform:scale(1.035)}@media(max-width:500px){.gallery{gap:4px;height:230px}}</style></head><body><main class="gallery" id="gallery" aria-label="Rotating storybook fantasy artwork"></main><script>const gallery=document.getElementById('gallery');let images=[],deck=[],position=0;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function next(){if(!images.length)return;if(position+4>deck.length){deck=shuffle([...images]);position=0}const selected=deck.slice(position,position+4);position+=4;gallery.replaceChildren(...selected.map(name=>{const d=document.createElement('div');d.className='frame';const img=document.createElement('img');img.src=name;img.alt='Illustrated fantasy world';d.appendChild(img);return d}))}fetch('images.json').then(r=>r.json()).then(a=>{images=a;deck=shuffle([...images]);next();setInterval(next,20*60*1000)}).catch(()=>{gallery.textContent='Could not load images.json'})</script></body></html>
